name: Build & Release APK

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: silentguard-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Generate version tag
        id: version
        run: |
          # 获取最新 tag，如果没有则从 v1.0.0 开始
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          # 提取 major.minor.patch
          MAJOR=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f3)
          # patch 版本号 +1
          PATCH=$((PATCH + 1))
          if [ "$PATCH" -ge 100 ]; then PATCH=0; MINOR=$((MINOR + 1)); fi
          if [ "$MINOR" -ge 100 ]; then MINOR=0; MAJOR=$((MAJOR + 1)); fi
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${NEW_TAG#v}" >> $GITHUB_OUTPUT
          echo "Generated tag: $NEW_TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION=${{ steps.version.outputs.TAG }}
          VERSION_NUM=${VERSION#v}
          MAJOR=$(echo "$VERSION_NUM" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NUM" | cut -d. -f2)
          PATCH=$(echo "$VERSION_NUM" | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          ./gradlew testDebugUnitTest lintDebug assembleRelease -PVERSION_CODE=$CODE -PVERSION_NAME=$VERSION_NUM
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"

      - name: Remove signing material
        if: always()
        run: rm -f "${{ github.workspace }}/release.jks"

      # action-gh-release creates the tag at target_commitish when it does not exist.
      - name: Create tag and Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: SilentGuard ${{ steps.version.outputs.TAG }}
          body: |
            ## SilentGuard ${{ steps.version.outputs.TAG }}

            合并的 PR: #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}

            ### 安装方法
            1. 下载下方的 `silentguard-${{ steps.version.outputs.VERSION_NAME }}.apk` 文件
            2. 传输到 Android 手机上
            3. 打开文件安装（需允许"安装未知应用"）

            > 最低支持 Android 8.0 (API 26)
          files: app/build/outputs/apk/release/silentguard-*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
